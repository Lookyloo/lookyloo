# Local HTTPS setup
# From repository root:
#
# mkdir -p etc/nginx/certs
# (
#     umask 077
#     openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 365 \
#         -keyout etc/nginx/certs/localhost.key \
#         -out etc/nginx/certs/localhost.crt \
#         -subj "/CN=localhost" \
#         -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
# )
# docker compose -f docker-compose.nginx.yml up -d --build
#
# In config/generic.json, use website_listen_ip: "0.0.0.0",
# website_listen_port: 5100, and public_domain: "localhost".

server {
    listen 80;
    server_name _;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16M;

    location /monitoring/ {
        # Resolved at request time so nginx starts even without the monitoring service.
        resolver 127.0.0.11 valid=30s;
        set $monitoring_upstream http://monitoring:5200;
        rewrite ^/monitoring/(.*)$ /$1 break;
        proxy_pass $monitoring_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
    }

    location / {
        proxy_pass http://lookyloo:5100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
    }
}
